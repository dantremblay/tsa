name: tsa
arch: "${GOARCH}"
platform: linux
version: "${VERSION}"
release: "${RELEASE}"
maintainer: "Kassisol <support@kassisol.com>"
description: "Client to manage the TSA (CA) daemon"
homepage: "https://github.com/kassisol/tsa"
license: "GPL-3.0"
vendor: "Kassisol"
section: "utils"

contents:
  - src: bin/tsa
    dst: /usr/bin/tsa
    file_info:
      mode: 0755

  - src: dist/tsa/man/man8/
    dst: /usr/share/man/man8/
    type: tree
    file_info:
      mode: 0644

  - src: dist/tsa/shellcompletion/bash
    dst: /usr/share/bash-completion/completions/tsa
    file_info:
      mode: 0644

rpm:
  group: "Tools/Docker"
  summary: "Client to manage the TSA (CA) daemon"

deb: {}
